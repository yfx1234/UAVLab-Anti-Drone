target/offboard_vehicle:
  ros__parameters:
    common_origin_topic: /tracking/common_origin
    common_frame_id: map_ned
    target_scenario: s_curve
    takeoff_height_m: 35.0
    target_radius_m: 4.0
    target_speed_mps: 1.2
    target_heading_rad: 0.0
    target_path_length_m: 8.0
    target_path_width_m: 3.0
    target_motion_delay_s: 20.0
    offboard_rate_hz: 50.0
    offboard_warmup_s: 1.0
    # Target在20 s开始轨迹运动，Pursuer最早30 s后才允许进入B4打击瞄准。
    attack_enable_delay_s: 10.0

pursuer/offboard_vehicle:
  ros__parameters:
    common_origin_topic: /tracking/common_origin
    relative_state_topic: /tracking/relative/state
    relative_estimate_topic: /tracking/relative/estimate
    common_frame_id: map_ned
    control_level: attitude
    takeoff_height_m: 5.0
    offboard_rate_hz: 50.0
    offboard_warmup_s: 1.0
    altitude_hold_position_gain: 0.8
    altitude_hold_velocity_gain: 1.2
    altitude_hold_max_speed_mps: 2.0
    altitude_hold_max_acceleration_mps2: 2.0
    position_gain: 0.6
    velocity_feedforward: 1.0
    max_horizontal_speed_mps: 5.0
    max_vertical_speed_mps: 2.0
    standoff_distance_m: 3.0
    state_timeout_s: 0.5
    estimate_measurement_hold_s: 0.4
    acceleration_position_gain: 0.8
    acceleration_velocity_gain: 1.2
    max_horizontal_acceleration_mps2: 3.0
    max_vertical_acceleration_mps2: 2.0
    guidance_controller: mpc_3d
    corridor_vertical_separation_m: 30.0
    corridor_prediction_time_s: 0.8
    corridor_maximum_lead_distance_m: 2.0
    corridor_horizontal_position_gain: 0.45
    corridor_horizontal_velocity_gain: 1.5
    corridor_maximum_horizontal_acceleration_mps2: 1.5
    pursuer_yaw_mode: velocity
    pursuer_fixed_yaw_rad: 0.0
    pursuer_yaw_minimum_speed_mps: 0.3
    corridor_minimum_target_above_m: 0.5
    mpc_time_step_s: 0.1
    mpc_horizon_steps: 25
    mpc_position_weight: 1.0
    mpc_velocity_weight: 4.0
    mpc_acceleration_weight: 1.5
    mpc_terminal_weight_multiplier: 4.0
    mpc_maximum_horizontal_acceleration_mps2: 1.3
    mpc_desired_vertical_separation_m: 30.0
    mpc_maximum_vertical_acceleration_mps2: 0.5
    mpc_vertical_position_weight: 0.25
    mpc_vertical_velocity_weight: 6.0
    mpc_vertical_acceleration_weight: 4.0
    mpc_vertical_absolute_hold_blend: 0.7
    mpc_3d_entry_vertical_tolerance_m: 1.0
    mpc_3d_entry_vertical_speed_tolerance_mps: 0.5
    mpc_3d_entry_hold_time_s: 2.0
    invalid_estimate_velocity_damping: 1.4
    invalid_estimate_maximum_acceleration_mps2: 1.2
    hover_thrust: 0.725
    max_thrust: 0.9
    max_tilt_rad: 0.5
    alignment_maximum_tilt_rad: 0.40
    # 相机居中使用当前 LOS；接近走廊仍独立使用 prediction_time_s。
    alignment_prediction_time_s: 0.0
    alignment_entry_horizontal_distance_m: 1.5
    alignment_entry_relative_speed_mps: 0.8
    minimum_thrust: 0.1
    attitude_smoothing_time_constant_s: 0.35
    maximum_attitude_slew_rate_rad_s: 1.0
    attitude_gain: 3.0
    max_body_rate_rad_s: 3.0
    alignment_feasibility_topic: /tracking/alignment/feasibility
    feasibility_maximum_tilt_rad: 0.42
    feasibility_minimum_thrust_margin: 0.08
    feasibility_maximum_body_rate_rad_s: 2.0
    feasibility_maximum_altitude_loss_m: 1.2
    feasibility_minimum_range_m: 10.0
    feasibility_maximum_alignment_time_s: 60.0
    feasibility_maximum_available_thrust: 0.9
    mission_status_topic: /tracking/mission/status
    aim_entry_horizontal_distance_m: 10.0
    aim_exit_horizontal_distance_m: 12.0
    capture_minimum_range_m: 10.0
    capture_maximum_range_m: 35.0
    midcourse_alignment_blend: 0.3
    terminal_navigation_constant: 3.0
    terminal_minimum_closing_speed_mps: 0.5
    terminal_los_acceleration_mps2: 0.6
    terminal_acceleration_feedforward_gain: 0.5
    terminal_maximum_horizontal_acceleration_mps2: 2.0
    terminal_maximum_vertical_acceleration_mps2: 0.8
    terminal_alignment_blend: 0.7
    terminal_capture_alignment_blend: 0.95
    terminal_alignment_weight_slew_rate_per_s: 0.8
    collision_exit_range_m: 5.0
    alignment_ready_error_rad: 0.12
    takeoff_ready_tolerance_m: 0.6
    altitude_correction_threshold_m: 0.8
    mission_minimum_target_above_m: 0.5
    observation_topic: /tracking/camera/observation
    tracking_quality_topic: /tracking/quality_gate
    quality_maximum_position_variance: 4.0
    quality_maximum_innovation_mahalanobis: 11.345
    quality_maximum_observation_age_s: 0.2
    quality_maximum_estimate_age_s: 0.2
    relative_kinematics_topic: /tracking/relative/kinematics
    capture_window_topic: /tracking/capture_window
    virtual_capture_event_topic: /tracking/virtual_capture_event
    safety_status_topic: /tracking/safety/status
    mission_complete_topic: /tracking/mission/complete
    required_virtual_captures: 2
    reattack_cooldown_s: 3.0
    safety_minimum_range_m: 5.0
    safety_maximum_tilt_rad: 0.45
    safety_maximum_speed_mps: 4.0
    safety_maximum_altitude_error_m: 20.0
    recovery_maximum_tilt_rad: 0.12
    recovery_maximum_speed_mps: 0.5
    recovery_maximum_altitude_error_m: 0.6
    recovery_required_hold_time_s: 1.0
    # 深度相机 fx=12847.02 px 时，fx*tan(2 deg)=448.628 px。
    capture_maximum_pixel_error_px: 448.628
    capture_maximum_alignment_error_rad: 0.034906585
    capture_maximum_los_rate_rad_s: 0.25
    capture_maximum_predicted_miss_distance_m: 35.0
    capture_maximum_time_to_closest_approach_s: 15.0
    capture_required_hold_time_s: 0.2
    capture_minimum_distinct_frames: 5
    capture_camera_cx: 1919.5
    capture_camera_cy: 1079.5

perception/target_observation:
  ros__parameters:
    relative_state_topic: /tracking/relative/state
    observation_topic: /tracking/camera/observation
    attitude_topic: /px4_1/fmu/out/vehicle_attitude
    common_frame_id: map_ned
    camera_frame_id: pursuer/camera_optical
    camera_rate_hz: 30.0
    camera_width: 3840
    camera_height: 2160
    camera_fx: 1920.0
    camera_fy: 1920.0
    camera_cx: 1919.5
    camera_cy: 1079.5
    camera_minimum_depth_m: 0.05
    camera_translation_body_x_m: 0.0
    camera_translation_body_y_m: 0.0
    camera_translation_body_z_m: 0.0
    # H-4：与 2026-10-13 实物定案一致（宽轴沿机头，(0,1,0,0)）
    camera_q_body_to_optical_w: 0.0
    camera_q_body_to_optical_x: 1.0
    camera_q_body_to_optical_y: 0.0
    camera_q_body_to_optical_z: 0.0
    enable_pixel_noise: false
    pixel_noise_stddev_px: 1.0
    enable_depth_noise: false
    depth_noise_stddev_m: 0.05
    enable_latency: false
    latency_ms: 0.0
    enable_dropout: false
    dropout_probability: 0.0
    enable_outliers: false
    outlier_probability: 0.0
    outlier_min_depth_m: 1.0
    outlier_max_depth_m: 50.0
    random_seed: 1

perception/relative_estimator:
  ros__parameters:
    observation_topic: /tracking/camera/observation
    estimate_topic: /tracking/relative/estimate
    attitude_topic: /px4_1/fmu/out/vehicle_attitude
    common_frame_id: map_ned
    estimator_rate_hz: 50.0
    max_data_age_s: 0.5
    max_position_variance: 25.0
    attitude_sync_tolerance_s: 0.05
    attitude_buffer_s: 2.0
    measurement_pixel_stddev_px: 1.5
    measurement_depth_stddev_m: 0.10
    acceleration_noise_stddev_mps2: 2.0
    initial_position_stddev_m: 1.0
    initial_velocity_stddev_mps: 3.0
    innovation_gate_mahalanobis: 11.345
    camera_width: 3840
    camera_height: 2160
    camera_fx: 1920.0
    camera_fy: 1920.0
    camera_cx: 1919.5
    camera_cy: 1079.5
    camera_minimum_depth_m: 0.05
    camera_translation_body_x_m: 0.0
    camera_translation_body_y_m: 0.0
    camera_translation_body_z_m: 0.0
    # H-4：与 2026-10-13 实物定案一致（宽轴沿机头，(0,1,0,0)）
    camera_q_body_to_optical_w: 0.0
    camera_q_body_to_optical_x: 1.0
    camera_q_body_to_optical_y: 0.0
    camera_q_body_to_optical_z: 0.0

perception/relative_kinematics:
  ros__parameters:
    estimate_topic: /tracking/relative/estimate
    kinematics_topic: /tracking/relative/kinematics

visualization/trajectory_recorder:
  ros__parameters:
    target_state_topic: /tracking/target/state
    relative_state_topic: /tracking/relative/state
    observation_topic: /tracking/camera/observation
    estimate_topic: /tracking/relative/estimate
    output_directory: ""
    filename: ""
    record_rate_hz: 50.0
    max_state_age_s: 0.5
